# The ONERA OAT15A supercritical section (AIAA DPW-8/AePW-4 buffet working
# group, test case 1; Jacquin et al. 2009): M 0.73, Re 3e6 on the chord, T
# 271 K, buffet from alpha about 3.25 deg at about 69 Hz on the 0.23 m model.
# The grid is ONERA's (S. Deck) committee grid, scaled to unit chord
# (nssolver_preprocess_op2_helper plot3d_blocks ... scale=1/0.23); the
# geometry is ONERA's intellectual property and is not part of this
# repository. The free stream comes from scripts/airfoil/freestream.py.
mesh_file = meshes-op2/oat15a/deck.h5
output_file = outputs-op2/oat15a/oat15a.h5
init_mode = uniform
second_order = 1
limiter = 2
# At most 20% change of density and pressure per node and iteration: in
# transonic starts a few nodes otherwise overshoot, and skipping them blows up.
update_limit = 0.2
include_viscous = 1
include_sa = 1
gamma = 1.4
gas_constant = 287.05
rho_floor = 1.0e-3
p_floor = 10.0
time_scheme = implicit
implicit_cfl = 10
implicit_cfl_growth = 1.2
implicit_cfl_max = 1e4
iterations = 800
inner_iterations = 30
inner_tolerance = 1e-3
progress_interval = 10
