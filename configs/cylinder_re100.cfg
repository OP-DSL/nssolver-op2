# Laminar flow past a circular cylinder, Re 100 (on the diameter 1), M 0.2,
# T 300 K: periodic vortex shedding, Strouhal number about 0.165, mean drag
# coefficient about 1.33 and lift amplitude about 0.33 (Williamson 1989;
# Park et al. 1998). Dual time stepping; the mesh from
# nssolver_preprocess_op2_helper cylinder (scripts/cylinder/run.sh).
mesh_file = meshes-op2/cyl/cyl_coarse.h5
output_file = outputs-op2/cyl/re100.h5
init_mode = uniform
second_order = 1
limiter = 0
include_viscous = 1
include_sa = 0
gamma = 1.4
gas_constant = 287.05
rho_floor = 1.0e-9
p_floor = 1.0e-3
rho = 2.658346163236853e-05
u = 69.44379021914055
v = 0.0
w = 0.0
p = 2.2891917
nu_tilde = 0.0
time_scheme = implicit
implicit_cfl = 100
implicit_cfl_growth = 2
implicit_cfl_max = 1e6
time_step = 1.75e-3
physical_steps = 40
inner_iterations = 20
inner_tolerance = 1e-3
progress_interval = 5
