# ONERA M6 wing, inviscid (SU2's tutorial mesh and free stream: M 0.8395,
# alpha 3.06 deg). The mesh comes from scripts/run_onera_m6_validation.sh.
mesh_file = meshes-op2/onera_m6.h5
output_file = outputs-op2/onera_m6_solution.h5
init_mode = uniform
iterations = 150
progress_interval = 10
second_order = 1
limiter = 2
include_viscous = 0
include_sa = 0
gamma = 1.4
gas_constant = 287.05
rho_floor = 1.0e-4
p_floor = 100.0
rho = 1.2250122659906946
u = 285.26805348028574
v = 0.0
w = 15.249834230540356
p = 101325.0
nu_tilde = 0.0
time_scheme = implicit
implicit_cfl = 10
implicit_cfl_growth = 1.3
implicit_cfl_max = 1e4
