# The 18% biconvex circular-arc section (McDevitt et al. 1976, NASA Ames):
# self-excited shock oscillations at zero incidence for M about 0.73 to 0.78,
# Re 11e6 on the chord, SA, dual time stepping. The free stream comes from
# scripts/airfoil/freestream.py (scripts/airfoil/run.sh); the mesh from
# nssolver_preprocess_op2_helper circular_arc.
mesh_file = meshes-op2/arc/arc18.h5
output_file = outputs-op2/arc/arc18.h5
init_mode = uniform
second_order = 1
limiter = 2
# At most 20% change of density and pressure per node and iteration: in
# transonic starts a few nodes otherwise overshoot, and skipping them blows up.
update_limit = 0.2
include_viscous = 1
include_sa = 1
gamma = 1.4
gas_constant = 287.05
rho_floor = 1.0e-3
p_floor = 100.0
time_scheme = implicit
implicit_cfl = 10
implicit_cfl_growth = 2
implicit_cfl_max = 1e5
inner_iterations = 30
inner_tolerance = 1e-3
progress_interval = 10
