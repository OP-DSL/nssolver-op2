# NASA TMR 2D zero-pressure-gradient flat plate (verification, SA): M 0.2,
# Re 5e6 per unit length, T 300 K, free-stream nu_tilde 3 nu. The mesh comes
# from scripts/tmr/flatplate.sh (one of the TMR PLOT3D grid family).
mesh_file = meshes-op2/tmr/flatplate_137x97.h5
output_file = outputs-op2/tmr/flatplate_137x97.h5
init_mode = uniform
iterations = 300
progress_interval = 20
second_order = 1
# Unlimited, as the TMR reference runs: the edge limiter cycles in the boundary layer.
limiter = 0
include_viscous = 1
include_sa = 1
gamma = 1.4
gas_constant = 287.05
rho_floor = 1.0e-4
p_floor = 100.0
rho = 1.3291482641929746
u = 69.44379021914055
v = 0.0
w = 0.0
p = 114459.602770978
nu_tilde = 4.166627413148434e-05
time_scheme = implicit
implicit_cfl = 10
implicit_cfl_growth = 1.3
implicit_cfl_max = 1e4
